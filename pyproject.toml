[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sstrc7"
version = "1.0.1"
description = "Download and query the SSTRC7 all-sky star catalog (294 million stars, 18 photometric bands)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Zach Gazak" }]
keywords = ["astronomy", "star catalog", "astrometry", "photometry", "sstrc7", "space surveillance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy>=1.20", "astropy>=5.0", "tqdm"]

[project.optional-dependencies]
# Contributor tooling only; nothing here changes what the package can do.
# matplotlib and scipy are used by tools/analyze_depth.py.
dev = ["pytest>=7", "matplotlib>=3.5", "scipy>=1.7"]

[project.urls]
Homepage = "https://github.com/ssc-ai/sstrc7"
Source = "https://github.com/ssc-ai/sstrc7"
Issues = "https://github.com/ssc-ai/sstrc7/issues"

[project.scripts]
sstrc7 = "sstrc7.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sstrc7"]

[tool.hatch.build.targets.sdist]
include = ["src/sstrc7", "tests", "tools", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
